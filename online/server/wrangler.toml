# India Bay online server settings for Cloudflare.
# Fill in the two Supabase lines and your website address, then run:  npx wrangler deploy
name = "india-bay-online"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[vars]
# Supabase → Project Settings → API → Project URL
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
# Supabase → Project Settings → API Keys → Publishable key (or the legacy anon key). This key is public.
SUPABASE_KEY = "YOUR-PUBLISHABLE-KEY"
# Websites allowed to join, separated by commas (no slash at the end).
ALLOWED_ORIGINS = "https://manibasha.github.io,http://localhost:8000"

[[durable_objects.bindings]]
name = "REGION"
class_name = "Region"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Region"]
